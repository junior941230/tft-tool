[package]
name = "tft-tool"
version = "0.1.1"
edition = "2021"

[dependencies]
eframe = "0.31"
egui_extras = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls", "gzip", "brotli", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# 開發時也讓相依套件最佳化，避免 debug 版解析 JSON 太慢
[profile.dev.package."*"]
opt-level = 3
